<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="/logo-engram.webp" />
    <meta
      name="theme-color"
      content="#f7f7f8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#111215"
      media="(prefers-color-scheme: dark)"
    />
    <title>Engram Spira | Flashcards</title>
  </head>

  <body>
    <a
      href="#main-content"
      style="
        position: absolute;
        left: -9999px;
        top: auto;
        width: 1px;
        height: 1px;
        overflow: hidden;
      "
      onfocus="
        this.style.cssText =
          'position:fixed;top:8px;left:8px;z-index:9999;padding:8px 16px;background:var(--color-card,var(--loading-card));color:var(--color-foreground,var(--loading-foreground));border-radius:8px;border:1px solid var(--color-border,var(--loading-border));box-shadow:var(--loading-shadow);font-size:14px;font-weight:600;text-decoration:none'
      "
      onblur="
        this.style.cssText =
          'position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden'
      "
      >Skip to content</a
    >
    <div id="root">
      <!-- Inline loading shell rendered before JavaScript loads. -->
      <div
        id="app-loading-shell"
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100svh;
          background: var(--loading-background);
        "
      >
        <div
          role="status"
          aria-label="Loading"
          style="
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid var(--loading-track);
            border-top-color: var(--loading-ring);
            animation: spin 0.8s linear infinite;
          "
        ></div>
        <style>
          :root {
            --loading-background: #f7f7f8;
            --loading-card: #fdfdfe;
            --loading-foreground: #1a1b1f;
            --loading-border: #dfe1e6;
            --loading-ring: #202126;
            --loading-track: #dfe1e6;
            --loading-shadow: 0 8px 18px -8px rgb(31 38 52 / 0.18);
          }
          @keyframes spin {
            to {
              transform: rotate(360deg);
            }
          }
          @media (prefers-color-scheme: dark) {
            :root {
              --loading-background: #111215;
              --loading-card: #191a1f;
              --loading-foreground: #f3f4f6;
              --loading-border: #303239;
              --loading-ring: #eef0f3;
              --loading-track: #303239;
              --loading-shadow: 0 8px 20px -8px rgb(1 3 8 / 0.62);
            }
          }
          @media (prefers-reduced-motion: reduce) {
            #app-loading-shell > div {
              animation: none;
            }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
